<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#3A506B" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <!-- Abstract Digital Grid -->
  <g stroke="#ffffff" opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>
  <!-- Smartwatch Outline -->
  <g transform="translate(400, 225)" filter="url(#glow)">
    <!-- Strap Top -->
    <path d="M -50,-120 L -40,-200 L 40,-200 L 50,-120 Z" fill="#1C2541" stroke="#00F2FE" stroke-width="2" />
    <!-- Strap Bottom -->
    <path d="M -50,120 L -40,200 L 40,200 L 50,120 Z" fill="#1C2541" stroke="#00F2FE" stroke-width="2" />
    <!-- Watch body -->
    <rect x="-80" y="-120" width="160" height="240" rx="35" fill="#0B0C10" stroke="url(#neonGlow)" stroke-width="4" />
    <!-- Screen Inner -->
    <rect x="-70" y="-110" width="140" height="220" rx="28" fill="#0D0E15" />
    <!-- Dial face elements -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1F2833" stroke-width="4" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00F2FE" stroke-width="4" stroke-dasharray="220 314" />
    <!-- Telemetry numbers -->
    <text x="0" y="8" fill="white" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" text-anchor="middle">09:42</text>
    <text x="0" y="32" fill="#00F2FE" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">OCT 24</text>
    <!-- Heart rate line -->
    <path d="M -50,60 L -30,60 L -25,45 L -20,75 L -15,50 L -10,60 L 10,60 L 15,40 L 20,80 L 25,55 L 30,60 L 50,60" fill="none" stroke="#F43F5E" stroke-width="2" />
  </g>
  <!-- Editing Overlay graphics -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#4FACFE" stroke-width="1" opacity="0.3" />
  <line x1="100" y1="50" x2="100" y2="150" stroke="#4FACFE" stroke-dasharray="4 4" stroke-width="1" opacity="0.3" />
  <line x1="50" y1="100" x2="150" y2="100" stroke="#4FACFE" stroke-dasharray="4 4" stroke-width="1" opacity="0.3" />
  <!-- Text Elements -->
  <text x="60" y="390" fill="#00F2FE" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" letter-spacing="4">ZENITH WATCH</text>
  <text x="60" y="415" fill="#9CA3AF" font-family="'Inter', sans-serif" font-weight="400" font-size="16">COMMERCIAL DIRECT CUT &amp; VFX</text>
  <text x="710" y="410" fill="white" font-family="'Outfit', sans-serif" font-weight="600" font-size="18">00:30</text>
</svg>
