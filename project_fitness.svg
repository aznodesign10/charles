<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <!-- Speed Lines -->
  <path d="M -50,100 L 300,280 L 150,290 Z" fill="white" opacity="0.1" />
  <path d="M 100,50 L 500,320 L 350,335 Z" fill="white" opacity="0.08" />
  <path d="M 200,400 L 700,100 L 550,150 Z" fill="white" opacity="0.1" />
  <g stroke="#ffffff" stroke-width="3" opacity="0.3">
    <line x1="50" y1="225" x2="250" y2="225" stroke-dasharray="100 20 40 10" />
    <line x1="450" y1="120" x2="650" y2="120" stroke-dasharray="80 10 20 5" />
    <line x1="300" y1="360" x2="550" y2="360" stroke-dasharray="150 30" />
  </g>
  <!-- Runner Silhouette -->
  <g transform="translate(300, 80) scale(1.15)">
    <!-- Motion trails -->
    <path d="M 20,150 L -120,200 L -100,215 Z" fill="url(#fireGrad)" opacity="0.4" />
    <path d="M 60,80 L -80,110 L -60,125 Z" fill="url(#fireGrad)" opacity="0.6" />
    <!-- Body Silhouette -->
    <!-- Head -->
    <circle cx="100" cy="40" r="14" fill="#0D0E15" />
    <!-- Torso / Arms -->
    <path d="M 85,55 L 115,55 L 130,90 L 105,100 L 85,90 L 75,70 Z" fill="#0D0E15" />
    <!-- Arms -->
    <path d="M 85,55 L 60,75 L 45,65" fill="none" stroke="#0D0E15" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 110,55 L 135,70 L 160,55" fill="none" stroke="#0D0E15" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Legs -->
    <path d="M 90,95 L 70,140 L 110,185" fill="none" stroke="#0D0E15" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 105,95 L 130,130 L 100,165" fill="none" stroke="#0D0E15" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Interactive Captions Overlay (Social style) -->
  <g transform="translate(100, 100)">
    <rect x="-10" y="-25" width="220" height="42" fill="#F59E0B" rx="8" />
    <text x="100" y="5" fill="#0D0E15" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" text-anchor="middle" letter-spacing="1">NO EXCUSES!</text>
  </g>
  <!-- Text Elements -->
  <text x="60" y="390" fill="#EC4899" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" letter-spacing="4">APEX SHORTS</text>
  <text x="60" y="415" fill="#9CA3AF" font-family="'Inter', sans-serif" font-weight="400" font-size="16">VIRAL REELS &amp; TIKTOK COMPILATION</text>
  <text x="710" y="410" fill="white" font-family="'Outfit', sans-serif" font-weight="600" font-size="18">00:15</text>
</svg>
