<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#023E3A" />
      <stop offset="60%" stop-color="#0D5C56" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <!-- Mountains in Background -->
  <path d="M -50,450 L 200,200 L 450,380 L 650,150 L 900,450 Z" fill="#032523" opacity="0.6" />
  <path d="M 100,450 L 350,180 L 550,330 L 750,120 L 950,450 Z" fill="#011817" />
  <!-- Pine Tree Silhouettes -->
  <g fill="#000C0B">
    <!-- Tree 1 -->
    <path d="M 50,450 L 70,400 L 60,400 L 75,360 L 65,360 L 80,320 L 70,320 L 85,280 L 100,320 L 90,320 L 105,360 L 95,360 L 110,400 L 100,400 L 120,450 Z" />
    <!-- Tree 2 -->
    <path d="M 110,450 L 125,410 L 118,410 L 130,380 L 122,380 L 135,350 L 148,380 L 140,380 L 152,410 L 145,410 L 160,450 Z" />
    <!-- Tree 3 -->
    <path d="M 680,450 L 700,380 L 690,380 L 710,330 L 700,330 L 720,290 L 735,330 L 725,330 L 745,380 L 735,380 L 755,450 Z" />
    <!-- Tree 4 -->
    <path d="M 730,450 L 742,415 L 736,415 L 746,390 L 756,415 L 750,415 L 762,450 Z" />
  </g>
  <!-- Birds flying -->
  <g fill="none" stroke="#FF9F1C" stroke-width="2" stroke-linecap="round">
    <path d="M 220,120 Q 230,110 240,120 Q 250,110 260,120" />
    <path d="M 270,140 Q 278,132 286,140 Q 294,132 302,140" transform="scale(0.85) translate(40, 20)" />
    <path d="M 180,150 Q 188,142 196,150 Q 204,142 212,150" transform="scale(0.7) translate(70, 45)" />
  </g>
  <!-- Cinematic Camera Scope Overlay -->
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="white" stroke-width="1" opacity="0.15" />
  <circle cx="400" cy="225" r="5" fill="none" stroke="#FF9F1C" stroke-width="1.5" />
  <!-- Text Elements -->
  <text x="60" y="390" fill="#FF9F1C" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" letter-spacing="4">NATURE'S WHISPERS</text>
  <text x="60" y="415" fill="#9CA3AF" font-family="'Inter', sans-serif" font-weight="400" font-size="16">DOCUMENTARY EDIT &amp; NARRATIVE DESIGN</text>
  <text x="710" y="410" fill="white" font-family="'Outfit', sans-serif" font-weight="600" font-size="18">08:12</text>
</svg>
