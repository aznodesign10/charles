<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E38" />
      <stop offset="60%" stop-color="#3B1E4A" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="1" />
      <stop offset="50%" stop-color="#FB7185" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <!-- Glowing Sun -->
  <circle cx="400" cy="220" r="130" fill="url(#sunGlow)" />
  <!-- Mountain Silhouette -->
  <path d="M 0,450 L 250,280 L 400,380 L 600,200 L 800,450 Z" fill="#0F0F1A" opacity="0.8" />
  <path d="M 150,450 L 400,250 L 550,370 L 800,450 Z" fill="#08080C" />
  <!-- Torii Gate Silhouette -->
  <g transform="translate(350, 270) scale(0.65)" fill="#F43F5E">
    <!-- Top Bar -->
    <path d="M -20,20 C 30,10 120,10 170,20 L 165,0 C 115,-10 35,-10 -15,0 Z" />
    <path d="M -10,35 C 35,28 115,28 160,35 L 155,23 C 115,16 35,16 -5,23 Z" />
    <!-- Pillars -->
    <rect x="25" y="32" width="16" height="180" rx="3" transform="skewX(-2)" />
    <rect x="109" y="32" width="16" height="180" rx="3" transform="skewX(2)" />
    <!-- Crossbeams -->
    <rect x="15" y="65" width="120" height="12" />
    <!-- Center Piece -->
    <rect x="68" y="32" width="14" height="35" />
  </g>
  <!-- Overlay grid/reticle for editing theme -->
  <line x1="40" y1="40" x2="100" y2="40" stroke="#06B6D4" stroke-width="2" />
  <line x1="40" y1="40" x2="40" y2="100" stroke="#06B6D4" stroke-width="2" />
  <line x1="760" y1="40" x2="700" y2="40" stroke="#06B6D4" stroke-width="2" />
  <line x1="760" y1="40" x2="760" y2="100" stroke="#06B6D4" stroke-width="2" />
  <!-- Text Elements -->
  <text x="70" y="390" fill="#06B6D4" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" letter-spacing="4">JAPAN REEL</text>
  <text x="70" y="415" fill="#9CA3AF" font-family="'Inter', sans-serif" font-weight="400" font-size="16">COLOR GRADING &amp; VFX SHOWCASE</text>
  <text x="710" y="410" fill="white" font-family="'Outfit', sans-serif" font-weight="600" font-size="18">02:45</text>
</svg>
